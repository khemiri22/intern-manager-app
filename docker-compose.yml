services:
  spring-boot-app:
    image: khemiri22/spring-boot-app:latest
    container_name: spring-boot-app-container
    #ports:
      #- "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql/gestion_stagiaires?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: database_username
      SPRING_DATASOURCE_PASSWORD: database_password
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: gmail_address
      SPRING_MAIL_PASSWORD: gmail_app_password
      JWT_TOKEN: jwt_secret_key
      FILE_UPLOAD_DIR: /uploads/interns
    volumes:
      - uploads:/uploads/interns
    restart: always
    networks:
      - app-network
    depends_on:
      - mysql

  angular-app:
    image: khemiri22/angular-app:latest
    container_name: angular-app-container
    restart: always
    ports:
      - "4200:80"
    networks:
      - app-network

  mysql:
    image: mysql:5.7
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_ROOT_USER: mysql_user
      MYSQL_ROOT_PASSWORD: mysql_password
      MYSQL_DATABASE: gestion_stagiaires
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
volumes:
  mysql-data:
    driver: local
  uploads: 
    driver: local

networks:
  app-network:
    driver: bridge
